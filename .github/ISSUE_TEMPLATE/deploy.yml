name: "🌎 Deploy"
description: "배포 관련"
labels: ["Deploy"]
body:
  - type: input
    id: version
    attributes:
      label: "🏷 배포 버전 / 태그"
      description: "이번 배포의 커밋 태그나 버전 정보를 입력해 주세요."
      placeholder: "예: v0.4.0 (Phase 4 관리자 승인 페이지 반영)"
    validations:
      required: true
  - type: textarea
    id: release-summary
    attributes:
      label: "📝 주요 변경 사항"
      description: "이번 배포에 포함된 핵심 기능이나 수정 사항을 요약해 주세요."
      placeholder: "예: 승인 큐 기능 추가, Prompt Caching 반영, discord.py 봇 연동"
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: "✅ 배포 전 체크리스트"
      description: "배포 전 반드시 확인해야 할 항목들입니다."
      value: |
        - [ ] .env / 환경변수가 배포 서버(GCP e2-micro)에 반영됨
        - [ ] `docker-compose up --build` 로컬에서 정상 기동 확인
        - [ ] DB 마이그레이션(schema 변경) 여부 확인 및 백업
        - [ ] 구독자 DB·llm_calls.csv가 이미지에 포함되지 않았는지 확인
        - [ ] 헬스체크 엔드포인트 정상 응답 확인
    validations:
      required: true
  - type: textarea
    id: related-issues
    attributes:
      label: "🔗 관련 이슈"
      description: "이번 배포에 포함된 Feature나 Fix 이슈 번호(#)를 연결해 주세요."
      placeholder: "예: #12, #15, #18"
