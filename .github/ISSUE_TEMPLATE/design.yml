name: "🎨 Design"
description: "디자인 요소 반영"
labels: ["Design"]
body:
  - type: textarea
    id: overview
    attributes:
      label: "📌 작업 개요"
      description: "어떤 디자인 요소를 추가하거나 수정하시나요?"
      placeholder: "예: 소개 페이지 히어로 섹션 flip-card 애니메이션 수정"
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: "🖼 관련 에셋"
      description: "추가하거나 변경할 에셋/스타일 정보를 적어주세요."
      placeholder: "예: static/style.css의 --accent 색상 토큰, base.html Tailwind 설정"
  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      description: "할 일을 체크박스 형태로 작성해주세요."
      placeholder: "최대한 세분화 해서 적어주세요!"
    validations:
      required: true
  - type: textarea
    id: design-reference
    attributes:
      label: "🙋🏻 참고 자료 (디자인 가이드)"
      description: "피그마(Figma) 링크나 참고할 디자인 시안이 있다면 첨부해 주세요."
      placeholder: "Figma 링크 혹은 디자인 스크린샷 드래그"
