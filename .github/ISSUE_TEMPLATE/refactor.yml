name: "🛠️ Refactor"
description: "코드 리팩토링"
labels: ["Refactor"]
body:
  - type: textarea
    id: current-status
    attributes:
      label: "🧐 현재 상태 및 문제점"
      description: "어떤 부분의 코드를 왜 수정하려고 하시나요? (가독성, 중복, 복잡도 등)"
      placeholder: "예: scripts/index.py에 인덱싱·생성·검증 로직이 한 함수에 섞여 있어 테스트가 어렵습니다."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "🎯 리팩토링 목표"
      description: "어떤 방향으로 개선하고 싶으신가요?"
      placeholder: "예: 단계별로 함수를 분리하고 각 단계에 대한 단위 테스트를 추가합니다."
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      description: "할 일을 체크박스 형태로 작성해주세요."
      placeholder: "최대한 세분화 해서 적어주세요!"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "📈 기대 효과"
      description: "리팩토링 후에 어떤 점이 좋아질까요?"
      placeholder: "코드 가독성 향상, 단위 테스트 가능, 유지보수 비용 감소 등"
  - type: textarea
    id: references
    attributes:
      label: "🙋🏻 참고 자료"
      description: "참고한 기술 문서나 디자인 패턴 링크가 있다면 작성해 주세요."
